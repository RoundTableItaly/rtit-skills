name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run pytest -q
      - name: Controllo fughe di dati
        env:
          RTIT_LEAK_DENYLIST: ${{ secrets.RTIT_LEAK_DENYLIST }}
        run: uv run python tools/check_leaks.py
      - name: Pacchetti di rilascio
        run: uv run python tools/build_release.py
      # Avvio manuale: solo artifact da scaricare, nessuna release
      - name: Carica i pacchetti come artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rtit-pacchetti
          path: dist/
          if-no-files-found: error
      - name: GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
