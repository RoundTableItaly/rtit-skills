[project]
name = "rtit-skills"
version = "0.2.2"
description = "Strumenti per gli assistenti AI dei direttivi di Round Table Italia (tavola, zona, nazionale)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
  "icalendar>=5",
  "docxtpl>=0.16",
  "python-docx>=1.1",
]

[project.optional-dependencies]
word = ["docx2pdf>=0.1.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rtit = "rtit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtit"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
